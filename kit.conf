# Kit-wide defaults, read by install.sh and bin/ai.
# Per-user overrides live in ~/.config/ai-kit/config (set with `ai mode`, etc.)
# and environment variables always win (AI_MODE, AI_CTX, AI_DATA).

# local  = only local providers can be used; cloud providers are refused.
# hybrid = cloud providers in providers.conf can be used when you ask for them.
AI_MODE_DEFAULT=local

# Security floor for Open WebUI. v0.13.1 shipped security fixes (Nov 2026).
# Raise this whenever an advisory is published:
# https://github.com/open-webui/open-webui/security/advisories
OPEN_WEBUI_MIN=0.13.1
OPEN_WEBUI_PORT=8080

# Where the kit runs Ollama. Keep it on loopback.
OLLAMA_ADDR=127.0.0.1:11434

# Default context window for local models (tokens). Bigger uses more RAM.
AI_CTX_DEFAULT=16384

# Python used for the uv-installed tools (Open WebUI, llm).
PYTHON_VERSION=3.12
