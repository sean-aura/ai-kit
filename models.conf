# Models, by role. One line each:
#   role|provider|model|min_RAM_GB|note
#
# How a role is chosen:
#   ai ask code "..."            -> first LOCAL row for "code" that fits this machine's RAM
#   ai ask --cloud code "..."    -> first CLOUD row for "code" (hybrid mode only)
#   ai ask anthropic/claude-opus-5-5 "..."   -> exactly that provider and model
#   ai ask qwen3:8b "..."        -> any Ollama tag directly
#
# Order matters: list local rows best-first. `ai sync` downloads only the pick
# for each role (use `ai sync --all` for every row that fits). `ai prune` removes
# Ollama models that are no longer listed here.
#
# Tags and model IDs change. If `ai sync` says FAILED, look up the current tag at
# https://ollama.com/search. For cloud IDs run `ai models --remote <provider>`.
# Personal additions go in ~/.config/ai-kit/models.conf (same format, read first).

# ---- general chat ---------------------------------------------------------
chat|ollama|qwen3.8:27b|32|strong all-rounder; vision, tools, long context
chat|ollama|gemma4:26b|24|good all-rounder (MoE, quick)
chat|ollama|qwen3:8b|16|light; leaves RAM free
chat|anthropic|claude-sonnet-5-5|0|cloud default
chat|openai|gpt-5.5|0|cloud: check the current ID with `ai models --remote openai`
chat|gemini|gemini-3.8-flash|0|cloud: check the current ID with `ai models --remote gemini`

# ---- writing: drafting, rewording, summaries ------------------------------
write|ollama|gemma4:26b|24|clear prose, follows style instructions
write|ollama|qwen3:8b|16|quick edits and rewording
write|anthropic|claude-opus-5-5|0|cloud: long or high-stakes writing

# ---- code -----------------------------------------------------------------
code|ollama|qwen3-coder:30b|32|MoE (about 3B active), 256K context
code|ollama|gpt-oss:20b|24|good reasoning for its size
code|ollama|qwen2.5-coder:7b|16|small; completions and snippets
code|anthropic|claude-opus-5-5|0|cloud: also used by `ai code --cloud`

# ---- vision: describe or read images and screenshots ----------------------
vision|ollama|qwen3.8:27b|32|same weights as chat on 32GB+ machines
vision|ollama|gemma3:4b|16|small vision model
vision|gemini|gemini-3.8-flash|0|cloud: check the current ID with `ai models --remote gemini`

# ---- image generation -----------------------------------------------------
# Ollama image generation is experimental and macOS-only (Jan 2026).
image|ollama|x/z-image-turbo|24|Apache-2.0; photoreal, renders text
image|ollama|x/flux2-klein|16|fast; check the licence of the size you pull (9B is non-commercial)
image|openai|gpt-image-2|0|cloud

# ---- embeddings: document search in the chat window (needed offline) -------
embed|ollama|nomic-embed-text|8|used by Open WebUI for uploaded documents
