# Providers: where models run. One line each:
#   name|kind|base_url|key_variable
#
# kind:  local  -> runs on this machine, always allowed
#        cloud  -> sends prompts off the machine, only allowed in hybrid mode
#
# Every provider is reached through its OpenAI-compatible endpoint, so adding a
# new one (OpenRouter, Mistral, Groq, LM Studio, vLLM, a company gateway...) is
# one line here. Keys are never stored in this file: `ai key set <name>` saves
# them in the macOS Keychain (or ~/.config/ai-kit/keys.env, mode 600, elsewhere),
# and an environment variable of the same name always takes precedence.
#
# Personal additions go in ~/.config/ai-kit/providers.conf (same format, read first).

ollama|local|http://127.0.0.1:11434/v1|      # address comes from kit.conf OLLAMA_ADDR or AI_OLLAMA_ADDR
anthropic|cloud|https://api.anthropic.com/v1|ANTHROPIC_API_KEY
openai|cloud|https://api.openai.com/v1|OPENAI_API_KEY
gemini|cloud|https://generativelanguage.googleapis.com/v1beta/openai|GEMINI_API_KEY
openrouter|cloud|https://openrouter.ai/api/v1|OPENROUTER_API_KEY

# Optional local servers. Uncomment if you run them.
# lmstudio|local|http://127.0.0.1:1234/v1|
# vllm|local|http://127.0.0.1:8000/v1|
